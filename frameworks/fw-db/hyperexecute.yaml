---
version: "0.1"
globalTimeout: 10
testSuiteTimeout: 10
testSuiteStep: 5
runson: linux
autosplit: true
concurrency: 2
retryOnFailure: false
maxRetries: 0
scenarioCommandStatusOnly: true

runtime:
  language: python
  version: "3.10.12"

pre:
  - pip install pytest pytest-html

testDiscovery:
  type: raw
  mode: dynamic
  command: grep -rl 'def test_' --include=test_*.py . | sed 's|^\./||'

testRunnerCommand: pytest $test --junitxml=report.xml --html=pytest-report.html --self-contained-html -v 2>&1 | tee pytest-run.log

report: true
partialReports:
  location: .
  type: xml
  frameworkName: pytest
uploadArtefacts:
  - name: pytest-html-report
    path: ["pytest-report.html"]
  - name: pytest-run-log
    path: ["pytest-run.log"]

jobLabel: ['he-playground', 'fw-db']
