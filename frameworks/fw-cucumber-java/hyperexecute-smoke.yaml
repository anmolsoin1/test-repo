---
version: "0.1"
globalTimeout: 60
testSuiteTimeout: 60
testSuiteStep: 60
runson: linux
autosplit: true
concurrency: 2
scenarioCommandStatusOnly: true
pre:
  - java -version
  - mvn -version
  - mvn -Dmaven.repo.local=m2_cache_dir -Dmaven.test.skip=true -q install
cacheKey: '{{ checksum "pom.xml" }}'
cacheDirectories:
  - m2_cache_dir
testDiscovery:
  type: raw
  mode: static
  command: ls src/test/resources/features/*.feature
testRunnerCommand: mvn test -Dtest=TestRunner -Dcucumber.features="$test" -Dcucumber.filter.tags=@smoke -Dmaven.repo.local=m2_cache_dir
uploadArtefacts:
  - name: CucumberReportsSmoke
    path:
      - target/cucumber-reports/CucumberTestReport.json
      - target/cucumber-reports/cucumber-pretty.html
      - target/cucumber-reports/execution.log
mergeArtifacts: true
report: true
partialReports:
  - location: target/cucumber-reports
    type: json
    frameworkName: cucumber
jobLabel: [cucumber-jvm, linux, playground-smoke]
