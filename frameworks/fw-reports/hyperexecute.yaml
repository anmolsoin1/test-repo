---
version: "0.1"
globalTimeout: 10
testSuiteTimeout: 10
testSuiteStep: 5
runson: linux
autosplit: true
concurrency: 2
retryOnFailure: false
maxRetries: 0

runtime:
  language: python
  version: "3.10"

pre:
  - pip install pytest

testDiscovery:
  type: raw
  mode: dynamic
  command: python3 -m pytest tests --collect-only -q | grep '::'

testRunnerCommand: bash -c 'mkdir -p reports out; h=$(echo "$test" | md5sum | cut -c1-8); python3 -m pytest "$test" -q --junitxml="reports/junit-$h.xml"'

report: true
partialReports:
  - type: xml
    location: reports/
    frameworkName: pytest

mergeArtifacts: true
uploadArtefacts:
  - name: junit-xml
    path:
      - reports/
  - name: execution-log
    path:
      - out/execution.log
  - name: screenshots
    path:
      - out/screenshot-add-to-cart.png

jobLabel: ['he-playground', 'fw-reports']
