---
version: "0.1"
globalTimeout: 10
testSuiteTimeout: 3
testSuiteStep: 1
runson: linux
autosplit: true
concurrency: 6
retryOnFailure: false
maxRetries: 0
scenarioCommandStatusOnly: true
runtime:
  language: node
  version: "20"
testDiscovery:
  type: raw
  mode: dynamic
  command: ls cases/quick_*.sh cases/flaky_node.js cases/slow90.sh cases/rotate.sh
testRunnerCommand: bash -c 'case "$test" in *.js) node "$test";; *) bash "$test";; esac'
env:
  OUTCOME: ${OUTCOME}
jobLabel: ['he-playground', 'fw-lifecycle-scale6']
