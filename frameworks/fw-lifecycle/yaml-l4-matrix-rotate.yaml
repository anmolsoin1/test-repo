---
version: "0.1"
globalTimeout: 8
testSuiteTimeout: 5
testSuiteStep: 1
runson: ${matrix.os}
autosplit: true
concurrency: 3
parallelism: 1
retryOnFailure: false
maxRetries: 0
scenarioCommandStatusOnly: true
matrix:
  os: [linux, mac, win]
  case: [rotate]
testDiscovery:
  type: raw
  mode: dynamic
  command: echo cases/rotate.sh
testRunnerCommand: bash "$test"
env:
  OUTCOME: ${OUTCOME}
jobLabel: ['he-playground', 'fw-lifecycle-matrix']
