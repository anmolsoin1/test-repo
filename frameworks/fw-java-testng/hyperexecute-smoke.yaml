---
version: "0.2"
globalTimeout: 20
runson: linux
autosplit: true
concurrency: 2
retryOnFailure: false
maxRetries: 0

framework:
  name: maven/testng
  discoveryType: method
  discoveryMode: remote
  defaultReports: true
  flags: ['-Dgroups=smoke']

# stage never associates test IDs for maven/testng junit reports (known trap);
# without this the job stays "skipped" even when every test passes.
scenarioCommandStatusOnly: true

mergeArtifacts: true
uploadArtefacts:
  - name: surefire-reports
    path:
      - target/surefire-reports/**

jobLabel: ['he-playground', 'fw-java-testng', 'groups-smoke']
