---
version: "0.1"
globalTimeout: 10
testSuiteTimeout: 10
testSuiteStep: 10

runson: linux
autosplit: true
concurrency: 1
retryOnFailure: false
maxRetries: 0
scenarioCommandStatusOnly: true

runtime:
  language: dotnet
  version: "8"

pre:
  - dotnet restore
  - dotnet build -c Release

# Tag-filtered variant: run only @smoke scenarios across both feature files.
testDiscovery:
  type: raw
  mode: remote
  command: echo smoke

testRunnerCommand: dotnet test -c Release --no-build --filter "(Category=$test)" --logger "nunit;LogFileName=results.xml"

mergeArtifacts: true

uploadArtefacts:
  - name: Execution_Logs
    path:
      - bin/Release/net8.0/logs/execution.log
  - name: NUnit_Xml
    path:
      - TestResults/results.xml

report: true
partialReports:
  - location: TestResults
    type: xml
    frameworkName: specflow

jobLabel: ['he-playground', 'fw-specflow-smoke']
