---
version: "0.1"
globalTimeout: 10
testSuiteTimeout: 10
testSuiteStep: 10
runson: linux
autosplit: true
concurrency: 2
failFast:
  maxNumberOfTests: 2
retryOnFailure: false
maxRetries: 0

testDiscovery:
  type: raw
  mode: dynamic
  command: ls cases/fail.sh cases/sleep120.sh

testRunnerCommand: bash "$test"

jobLabel: ['he-playground', 'j3-failfast']
