---
version: "0.1"
globalTimeout: 10
testSuiteTimeout: 10
testSuiteStep: 5
runson: linux
autosplit: true
concurrency: 2
retryOnFailure: false
maxRetries: 0

runtime:
  language: python
  version: "3.10"

pre:
  - pip install pytest

testDiscovery:
  type: raw
  mode: dynamic
  command: ls cases/pass.sh cases/fail.sh cases/node_fail.js cases/test_mixed.py

testRunnerCommand: bash -c 'case "$test" in *.sh) bash "$test";; *.py) python3 -m pytest "$test" -q;; *.js) node "$test";; esac'

jobLabel: ['he-playground', 'j1b-cmd-status-only']

scenarioCommandStatusOnly: true
